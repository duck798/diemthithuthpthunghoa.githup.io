<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Khảo Sát</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; color: #333; background: #f4f7f6; }
        .container { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; font-size: 24px;}
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; outline: none; }
        input:focus { border-color: #3498db; }
        button { padding: 12px 20px; background-color: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        button:hover { background-color: #2980b9; }
        .result-card { background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 5px solid #3498db; margin-top: 15px; line-height: 1.8; display: none; }
        .highlight { font-weight: bold; color: #e74c3c; }
        .diff { font-weight: bold; }
        .diff.up { color: #27ae60; }
        .diff.down { color: #e74c3c; }
        .combo { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; font-weight: bold; color: #2980b9;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Điểm khảo sát 3 đợt của sở và trường</h2>
        <div class="search-box">
            <input type="text" id="nameInput" placeholder="Nhập tên học sinh để tìm...">
            <button onclick="traCuu()">Tra cứu</button>
        </div>
        <div id="result" class="result-card"></div>
    </div>

    <script>
        let dataSo1 = [], dataTruongText = "", dataSo2 = [];

        // Tự động tải 3 file CSV trên GitHub khi mở web
        async function loadData() {
            try {
                const [resSo1, resTruong, resSo2] = await Promise.all([
                    fetch('so1.csv'),
                    fetch('truong.csv'),
                    fetch('so2.csv')
                ]);
                
                const textSo1 = await resSo1.text();
                dataTruongText = await resTruong.text();
                const textSo2 = await resSo2.text();

                dataSo1 = Papa.parse(textSo1, {header: true}).data;
                dataSo2 = Papa.parse(textSo2, {header: true}).data;
            } catch (e) {
                console.log("Lỗi tải dữ liệu. Hãy đảm bảo 3 file csv đã được up lên cùng thư mục.");
            }
        }

        loadData();

        function tinhTongSo(student) {
            if (!student) return 0;
            return (parseFloat(student['Điểm Toán']) || 0) + 
                   (parseFloat(student['Điểm Ngữ văn']) || 0) + 
                   (parseFloat(student['Điểm Tổ hợp môn thứ 1']) || 0) + 
                   (parseFloat(student['Điểm Tổ hợp môn thứ 2']) || 0);
        }

        // Tính tổng 4 môn đợt trường (quét các cột điểm trong file)
        function timDiemTruong(name) {
            const lines = dataTruongText.split('\n');
            for (let l of lines) {
                if (l.toLowerCase().includes(name.toLowerCase())) {
                    const parts = l.split(',');
                    let sum = 0;
                    for (let i = 6; i <= 20; i++) {
                        let val = parseFloat(parts[i]);
                        if (!isNaN(val)) sum += val;
                    }
                    return sum;
                }
            }
            return 0;
        }

        function goiYToHop(student) {
            if (!student) return "Tập trung ôn luyện thi Đánh giá tư duy nhé!";
            const note = (student['Ghi chú'] || '').toLowerCase();
            let tohop = "";
            if (note.includes('vật lí') || note.includes('hóa học')) tohop = "A00, A01 hoặc B00";
            else if (note.includes('lịch sử') || note.includes('địa lí')) tohop = "C00, C04 hoặc D01";
            else tohop = "D01 hoặc các khối xét tuyển kết hợp";
            
            return `Tổ hợp môn phù hợp: ${tohop} (Nên tập trung mạnh Toán, Anh và bài thi Tư duy nếu muốn chốt Hệ thống thông tin quản lý nhé).`;
        }

        function traCuu() {
            const name = document.getElementById('nameInput').value.trim().toLowerCase();
            const resultDiv = document.getElementById('result');
            if (!name) return;

            const hsSo1 = dataSo1.find(r => r['Họ và tên'] && r['Họ và tên'].toLowerCase() === name);
            const hsSo2 = dataSo2.find(r => r['Họ và tên'] && r['Họ và tên'].toLowerCase() === name);
            const tongTruong = timDiemTruong(name);

            if (!hsSo1 && !hsSo2 && tongTruong === 0) {
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `<span class="highlight">Không tìm thấy dữ liệu! Hãy kiểm tra lại tên.</span>`;
                return;
            }

            const tongSo1 = tinhTongSo(hsSo1);
            const tongSo2 = tinhTongSo(hsSo2);

            const cl1 = tongTruong - tongSo1;
            const cl2 = tongSo2 - tongTruong;

            const formatCL = (val) => val > 0 ? `<span class="diff up">tăng ${val.toFixed(2)} điểm</span>` : `<span class="diff down">giảm ${Math.abs(val).toFixed(2)} điểm</span>`;

            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <h3>KẾT QUẢ: <span style="color:#2c3e50">${hsSo2 ? hsSo2['Họ và tên'] : (hsSo1 ? hsSo1['Họ và tên'] : name.toUpperCase())}</span></h3>
                <p><b>1. Đợt Sở 1:</b> Tổng 4 môn: ${tongSo1 > 0 ? tongSo1.toFixed(2) : 'Không thi'}</p>
                <p><b>2. Đợt Trường:</b> Tổng 4 môn: ${tongTruong > 0 ? tongTruong.toFixed(2) : 'Không thi'} 
                   <br><i>(Chênh lệch so với đợt Sở 1: ${formatCL(cl1)})</i></p>
                <p><b>3. Đợt Sở 2:</b> Tổng 4 môn: ${tongSo2 > 0 ? tongSo2.toFixed(2) : 'Không thi'} 
                   <br><i>(Chênh lệch so với đợt Trường: ${formatCL(cl2)})</i></p>
                <div class="combo">
                    💡 ${goiYToHop(hsSo2 || hsSo1)}
                </div>
            `;
        }
    </script>
</body>
</html>
